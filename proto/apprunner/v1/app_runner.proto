syntax = "proto3";

package apprunner.v1;

option go_package = "github.com/roflware/app-runner/internal/gen/apprunner/v1;apprunnerv1";

service AppRunnerService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Echo(EchoRequest) returns (EchoResponse);
}

message PingRequest {}

message PingResponse {
  string message = 1;
  string server_time = 2;
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}
