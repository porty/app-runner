syntax = "proto3";

package apprunner.v1;

option go_package = "github.com/roflware/app-runner/internal/gen/apprunner/v1;apprunnerv1";

service AppRunnerService {
  rpc GetHostStatus(GetHostStatusRequest) returns (GetHostStatusResponse);
  rpc ListISOs(ListISOsRequest) returns (ListISOsResponse);
  rpc ListDiskImages(ListDiskImagesRequest) returns (ListDiskImagesResponse);
  rpc ListStorage(ListStorageRequest) returns (ListStorageResponse);
  rpc DownloadStorageFile(DownloadStorageFileRequest) returns (DownloadStorageFileResponse);
  rpc ListVMs(ListVMsRequest) returns (ListVMsResponse);
  rpc GetVM(GetVMRequest) returns (GetVMResponse);
  rpc CreateVM(CreateVMRequest) returns (CreateVMResponse);
  rpc CloneVM(CloneVMRequest) returns (CloneVMResponse);
  rpc StartVM(StartVMRequest) returns (StartVMResponse);
  rpc StopVM(StopVMRequest) returns (StopVMResponse);
  rpc RebootVM(RebootVMRequest) returns (RebootVMResponse);
  rpc UpdateVM(UpdateVMRequest) returns (UpdateVMResponse);
  rpc AddVMNIC(AddVMNICRequest) returns (AddVMNICResponse);
  rpc UpdateVMNIC(UpdateVMNICRequest) returns (UpdateVMNICResponse);
  rpc RemoveVMNIC(RemoveVMNICRequest) returns (RemoveVMNICResponse);
  rpc AddVMDisk(AddVMDiskRequest) returns (AddVMDiskResponse);
  rpc RemoveVMDisk(RemoveVMDiskRequest) returns (RemoveVMDiskResponse);
  rpc AddVMCDROM(AddVMCDROMRequest) returns (AddVMCDROMResponse);
  rpc UpdateVMCDROM(UpdateVMCDROMRequest) returns (UpdateVMCDROMResponse);
  rpc RemoveVMCDROM(RemoveVMCDROMRequest) returns (RemoveVMCDROMResponse);
  rpc ConfigureVMCloudInit(ConfigureVMCloudInitRequest) returns (ConfigureVMCloudInitResponse);
  rpc ConfigureVMIPMI(ConfigureVMIPMIRequest) returns (ConfigureVMIPMIResponse);
  rpc DeleteVM(DeleteVMRequest) returns (DeleteVMResponse);
  rpc GetNetworkingStatus(GetNetworkingStatusRequest) returns (GetNetworkingStatusResponse);
  rpc ApplyNetworkChange(ApplyNetworkChangeRequest) returns (ApplyNetworkChangeResponse);
  rpc ConfirmNetworkChange(ConfirmNetworkChangeRequest) returns (ConfirmNetworkChangeResponse);
  rpc RevertNetworkChange(RevertNetworkChangeRequest) returns (RevertNetworkChangeResponse);
  rpc ConfigureBridgeDHCP(ConfigureBridgeDHCPRequest) returns (ConfigureBridgeDHCPResponse);
  rpc ClearBridgeDHCPLeases(ClearBridgeDHCPLeasesRequest) returns (ClearBridgeDHCPLeasesResponse);
  rpc DeleteBridgeDHCPLease(DeleteBridgeDHCPLeaseRequest) returns (DeleteBridgeDHCPLeaseResponse);
  rpc SetBridgeDHCPStaticLease(SetBridgeDHCPStaticLeaseRequest) returns (SetBridgeDHCPStaticLeaseResponse);
  rpc ListCloudInitTemplates(ListCloudInitTemplatesRequest) returns (ListCloudInitTemplatesResponse);
  rpc CreateCloudInitTemplate(CreateCloudInitTemplateRequest) returns (CreateCloudInitTemplateResponse);
  rpc UpdateCloudInitTemplate(UpdateCloudInitTemplateRequest) returns (UpdateCloudInitTemplateResponse);
  rpc DeleteCloudInitTemplate(DeleteCloudInitTemplateRequest) returns (DeleteCloudInitTemplateResponse);
}

enum VMStatus {
  VM_STATUS_UNSPECIFIED = 0;
  VM_STATUS_STOPPED = 1;
  VM_STATUS_RUNNING = 2;
  VM_STATUS_STOPPING = 3;
  VM_STATUS_ERROR = 4;
}

enum NetworkMode {
  NETWORK_MODE_UNSPECIFIED = 0;
  NETWORK_MODE_NAT = 1;
  NETWORK_MODE_BRIDGE = 2;
}

enum VMFirmware {
  VM_FIRMWARE_UNSPECIFIED = 0;
  VM_FIRMWARE_BIOS = 1;
  VM_FIRMWARE_UEFI = 2;
}

// A virtual machine has zero or more disks, CD-ROM drives, and network
// interfaces; none are implied.
message VirtualMachine {
  string id = 1;
  string name = 2;
  string description = 3;
  uint32 cpus = 4;
  uint32 memory_mib = 5;
  VMFirmware firmware = 6;
  VMStatus status = 7;
  string created_at = 8;
  string last_error = 9;
  string console_path = 10;
  repeated VMDisk disks = 11;
  repeated VMCDROM cdroms = 12;
  repeated VMNIC nics = 13;
  VMCloudInit cloud_init = 14;
  VMIPMIStatus ipmi = 15;
}

// Disks attach in list order; the first disk is the boot disk. source_image
// names the cloud image in ISO storage that a linked disk overlays.
message VMDisk {
  string id = 1;
  uint32 size_gib = 2;
  string source_image = 3;
}

message VMCDROM {
  string id = 1;
  string iso_name = 2;
}

message VMNIC {
  string id = 1;
  NetworkMode mode = 2;
  string bridge_name = 3;
  string mac_address = 4;
}

message VMDiskSpec {
  uint32 size_gib = 1;
  string source_image = 2;
}

message VMCDROMSpec {
  string iso_name = 1;
}

// mac_address is generated when empty.
message VMNICSpec {
  NetworkMode mode = 1;
  string bridge_name = 2;
  string mac_address = 3;
}

message VMCloudInit {
  bool enabled = 1;
  string user_data = 2;
}

message VMIPMIStatus {
  bool enabled = 1;
  string bridge_name = 2;
  string address = 3;
  uint32 port = 4;
  string username = 5;
  bool running = 6;
  string last_error = 7;
}

message HostStatus {
  bool qemu_available = 1;
  bool kvm_available = 2;
}

message ISOImage {
  string name = 1;
  uint64 size_bytes = 2;
}

message GetHostStatusRequest {}

message GetHostStatusResponse {
  HostStatus status = 1;
}

message ListISOsRequest {}

message ListISOsResponse {
  repeated ISOImage images = 1;
}

message DiskImage {
  string name = 1;
  uint64 size_bytes = 2;
}

message ListDiskImagesRequest {}

message ListDiskImagesResponse {
  repeated DiskImage images = 1;
}

enum StorageEntryKind {
  STORAGE_ENTRY_KIND_UNSPECIFIED = 0;
  STORAGE_ENTRY_KIND_FILE = 1;
  STORAGE_ENTRY_KIND_DIRECTORY = 2;
}

message StorageEntry {
  string name = 1;
  string path = 2;
  StorageEntryKind kind = 3;
  uint64 size_bytes = 4;
  string modified_at = 5;
  repeated StorageEntry children = 6;
}

message StorageRoot {
  string name = 1;
  repeated StorageEntry entries = 2;
}

message ListStorageRequest {}

message ListStorageResponse {
  repeated StorageRoot roots = 1;
}

message DownloadStorageFileRequest {
  string root = 1;
  string directory = 2;
  string url = 3;
  string filename = 4;
}

message DownloadStorageFileResponse {
  StorageEntry file = 1;
}

message ListVMsRequest {}

message ListVMsResponse {
  repeated VirtualMachine virtual_machines = 1;
}

message GetVMRequest {
  string id = 1;
}

message GetVMResponse {
  VirtualMachine virtual_machine = 1;
}

// firmware defaults to UEFI when any disk overlays a cloud image and BIOS
// otherwise.
message CreateVMRequest {
  string name = 1;
  string description = 2;
  uint32 cpus = 3;
  uint32 memory_mib = 4;
  VMFirmware firmware = 5;
  repeated VMDiskSpec disks = 6;
  repeated VMCDROMSpec cdroms = 7;
  repeated VMNICSpec nics = 8;
  bool cloud_init_enabled = 9;
  string cloud_init_user_data = 10;
}

message CreateVMResponse {
  VirtualMachine virtual_machine = 1;
}

message CloneVMRequest {
  string id = 1;
  string name = 2;
}

message CloneVMResponse {
  VirtualMachine virtual_machine = 1;
}

message StartVMRequest {
  string id = 1;
}

message StartVMResponse {
  VirtualMachine virtual_machine = 1;
}

// A graceful stop asks the guest to shut down. When timeout_seconds is set
// and the guest is still running afterwards, the VM is forced off.
message StopVMRequest {
  string id = 1;
  bool force = 2;
  uint32 timeout_seconds = 3;
}

message StopVMResponse {
  VirtualMachine virtual_machine = 1;
}

message RebootVMRequest {
  string id = 1;
}

message RebootVMResponse {
  VirtualMachine virtual_machine = 1;
}

message UpdateVMRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  uint32 cpus = 4;
  uint32 memory_mib = 5;
}

message UpdateVMResponse {
  VirtualMachine virtual_machine = 1;
}

message AddVMNICRequest {
  string id = 1;
  VMNICSpec nic = 2;
}

message AddVMNICResponse {
  VirtualMachine virtual_machine = 1;
}

message UpdateVMNICRequest {
  string id = 1;
  string nic_id = 2;
  VMNICSpec nic = 3;
}

message UpdateVMNICResponse {
  VirtualMachine virtual_machine = 1;
}

message RemoveVMNICRequest {
  string id = 1;
  string nic_id = 2;
}

message RemoveVMNICResponse {
  VirtualMachine virtual_machine = 1;
}

message AddVMDiskRequest {
  string id = 1;
  VMDiskSpec disk = 2;
}

message AddVMDiskResponse {
  VirtualMachine virtual_machine = 1;
}

message RemoveVMDiskRequest {
  string id = 1;
  string disk_id = 2;
}

message RemoveVMDiskResponse {
  VirtualMachine virtual_machine = 1;
}

message AddVMCDROMRequest {
  string id = 1;
  string iso_name = 2;
}

message AddVMCDROMResponse {
  VirtualMachine virtual_machine = 1;
}

message UpdateVMCDROMRequest {
  string id = 1;
  string cdrom_id = 2;
  string iso_name = 3;
}

message UpdateVMCDROMResponse {
  VirtualMachine virtual_machine = 1;
}

message RemoveVMCDROMRequest {
  string id = 1;
  string cdrom_id = 2;
}

message RemoveVMCDROMResponse {
  VirtualMachine virtual_machine = 1;
}

message ConfigureVMCloudInitRequest {
  string id = 1;
  bool enabled = 2;
  string user_data = 3;
}

message ConfigureVMCloudInitResponse {
  VirtualMachine virtual_machine = 1;
}

message ConfigureVMIPMIRequest {
  string id = 1;
  bool enabled = 2;
  string bridge_name = 3;
  string address = 4;
  string username = 5;
  string password = 6;
}

message ConfigureVMIPMIResponse {
  VirtualMachine virtual_machine = 1;
}

message DeleteVMRequest {
  string id = 1;
}

message DeleteVMResponse {
  string id = 1;
}

enum DiagnosticStatus {
  DIAGNOSTIC_STATUS_UNSPECIFIED = 0;
  DIAGNOSTIC_STATUS_PASS = 1;
  DIAGNOSTIC_STATUS_WARNING = 2;
  DIAGNOSTIC_STATUS_FAIL = 3;
  DIAGNOSTIC_STATUS_INFO = 4;
}

enum NetworkChangeType {
  NETWORK_CHANGE_TYPE_UNSPECIFIED = 0;
  NETWORK_CHANGE_TYPE_CREATE_BRIDGE = 1;
  NETWORK_CHANGE_TYPE_DELETE_BRIDGE = 2;
  NETWORK_CHANGE_TYPE_SET_BRIDGE_UP = 3;
  NETWORK_CHANGE_TYPE_SET_BRIDGE_DOWN = 4;
  NETWORK_CHANGE_TYPE_ATTACH_INTERFACE = 5;
  NETWORK_CHANGE_TYPE_DETACH_INTERFACE = 6;
}

message NetworkDiagnostic {
  string key = 1;
  string label = 2;
  DiagnosticStatus status = 3;
  string detail = 4;
  string remediation = 5;
}

message UserIdentity {
  string username = 1;
  uint32 uid = 2;
  repeated string groups = 3;
  bool is_root = 4;
  bool has_cap_net_admin = 5;
  bool has_cap_net_bind_service = 6;
  bool has_cap_net_raw = 7;
}

message NetworkInterface {
  string name = 1;
  bool is_up = 2;
  uint32 mtu = 3;
  string hardware_address = 4;
  repeated string addresses = 5;
  string master = 6;
  bool is_bridge = 7;
  bool can_attach = 8;
}

message WorkloadAttachment {
  string id = 1;
  string name = 2;
  string workload_type = 3;
  bool running = 4;
}

message NetworkBridge {
  string name = 1;
  bool is_up = 2;
  uint32 mtu = 3;
  string hardware_address = 4;
  repeated string addresses = 5;
  repeated string member_interfaces = 6;
  repeated WorkloadAttachment workloads = 7;
  repeated NetworkDiagnostic diagnostics = 8;
  bool usable_by_qemu = 9;
  BridgeDHCPStatus dhcp = 10;
  string description = 11;
}

message BridgeDHCPStatus {
  bool enabled = 1;
  string cidr = 2;
  string server_address = 3;
  string pool_start = 4;
  string pool_end = 5;
  bool running = 6;
  uint32 active_leases = 7;
  string last_error = 8;
  bool nat_enabled = 9;
  bool nat_running = 10;
  bool dns_enabled = 11;
  repeated string dns_forwarders = 12;
  bool auto_dns = 13;
  string dns_suffix = 14;
  bool dns_running = 15;
  repeated DHCPLease leases = 16;
}

message DHCPLease {
  string hardware_address = 1;
  string address = 2;
  string expires_at = 3;
  string vm_name = 4;
  bool is_static = 5;
}

message PendingNetworkChange {
  string id = 1;
  string description = 2;
  string expires_at = 3;
}

message NetworkingStatus {
  UserIdentity user = 1;
  repeated NetworkDiagnostic diagnostics = 2;
  repeated NetworkBridge bridges = 3;
  repeated NetworkInterface interfaces = 4;
  PendingNetworkChange pending_change = 5;
  bool can_manage = 6;
}

message GetNetworkingStatusRequest {}

message GetNetworkingStatusResponse {
  NetworkingStatus status = 1;
}

message ApplyNetworkChangeRequest {
  NetworkChangeType type = 1;
  string bridge_name = 2;
  string interface_name = 3;
  bool migrate_addresses = 4;
}

message ApplyNetworkChangeResponse {
  PendingNetworkChange pending_change = 1;
}

message ConfirmNetworkChangeRequest {
  string id = 1;
}

message ConfirmNetworkChangeResponse {
  NetworkingStatus status = 1;
}

message RevertNetworkChangeRequest {
  string id = 1;
}

message RevertNetworkChangeResponse {
  NetworkingStatus status = 1;
}

message ConfigureBridgeDHCPRequest {
  string bridge_name = 1;
  bool enabled = 2;
  string cidr = 3;
  bool nat_enabled = 4;
  bool dns_enabled = 5;
  repeated string dns_forwarders = 6;
  bool auto_dns = 7;
  string dns_suffix = 8;
  string description = 9;
}

message ConfigureBridgeDHCPResponse {
  NetworkingStatus status = 1;
}

message ClearBridgeDHCPLeasesRequest {
  string bridge_name = 1;
}

message ClearBridgeDHCPLeasesResponse {
  NetworkingStatus status = 1;
}

message DeleteBridgeDHCPLeaseRequest {
  string bridge_name = 1;
  string hardware_address = 2;
}

message DeleteBridgeDHCPLeaseResponse {
  NetworkingStatus status = 1;
}

message SetBridgeDHCPStaticLeaseRequest {
  string bridge_name = 1;
  string hardware_address = 2;
  string address = 3;
}

message SetBridgeDHCPStaticLeaseResponse {
  NetworkingStatus status = 1;
}

message CloudInitTemplate {
  string name = 1;
  string user_data = 2;
  string created_at = 3;
  string updated_at = 4;
}

message ListCloudInitTemplatesRequest {}

message ListCloudInitTemplatesResponse {
  repeated CloudInitTemplate templates = 1;
}

message CreateCloudInitTemplateRequest {
  string name = 1;
  string user_data = 2;
}

message CreateCloudInitTemplateResponse {
  CloudInitTemplate template = 1;
}

message UpdateCloudInitTemplateRequest {
  string name = 1;
  string new_name = 2;
  string user_data = 3;
}

message UpdateCloudInitTemplateResponse {
  CloudInitTemplate template = 1;
}

message DeleteCloudInitTemplateRequest {
  string name = 1;
}

message DeleteCloudInitTemplateResponse {}
